<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USAGI Coffee — Good coffee fits into your day</title>
<meta name="description" content="USAGI Coffee: cà phê Robusta và Arabica Lâm Đồng. Những điều nhỏ bé làm nên một tách cà phê ngon hơn.">
<meta property="og:title" content="USAGI Coffee">

<body>
<header class="nav" id="nav">
  <a href="#product" class="brand" aria-label="USAGI Coffee — đầu trang">
    <img src="asset/frame2/logo%20usagi.png" alt="USAGI Coffee & Tea" width="358" height="490">
  </a>
  <nav aria-label="Điều hướng chính">
    <a href="#product">Product</a>
    <a href="#about">About</a>
    <a href="#journal">Journal</a>

  </nav>
</header>

<main>
  <section class="hero" id="product" tabindex="-1" aria-label="Sản phẩm USAGI">
    <div class="slides" id="slides" aria-live="polite">
      <figure class="slide slide-arabica active" data-title="USAGI Arabica" data-product="arabica">
        <div class="product-scene">
          <div class="product-wordmark" aria-hidden="true">
            <img class="wordmark-ara" src="asset/frame1/variant2/ARA.png" alt="" width="223" height="79">
            <img class="wordmark-bica" src="asset/frame1/variant2/BICA.png" alt="" width="249" height="82">
          </div>
          <img class="product-bag" src="asset/frame1/variant2/MOCKUP%20BAG%20NEW%20copy%201.png" alt="Túi cà phê Arabica USAGI 500 g." width="465" height="721">
        </div>
      </figure>
      <figure class="slide slide-robusta" data-title="USAGI Robusta" data-product="robusta">
        <div class="product-scene">
          <div class="product-wordmark" aria-hidden="true">
            <img class="wordmark-rob" src="asset/frame1/variant1/ROB.png" alt="" width="217" height="82">
            <img class="wordmark-usta" src="asset/frame1/variant1/USTA.png" alt="" width="267" height="82">
          </div>
          <img class="product-bag" src="asset/frame1/variant1/MOCKUP%20BAG%20NEW%20copy%201.png" alt="Túi cà phê Robusta USAGI 500 g." width="465" height="721">
        </div>
      </figure>
      <figure class="slide slide-filter" data-title="USAGI Coffee Filter" data-product="filter">
        <div class="product-scene">
          <div class="product-wordmark filter-wordmark" aria-hidden="true">
            <img class="wordmark-coffee" src="asset/frame1/variant3/COFFEEE.png" alt="" width="466" height="82">
            <img class="wordmark-filter" src="asset/frame1/variant3/FILTER.png" alt="" width="330" height="79">
          </div>
          <img class="filter-assembly" src="asset/frame1/variant3/B%E1%BB%99%20l%E1%BB%8Dc%20c%C3%A0%20ph%C3%AA%20kim%20lo%E1%BA%A1i%20t%C3%A1ch%20l%E1%BB%9Bp%20copy%201.png" alt="Bộ lọc cà phê kim loại USAGI gồm nắp, phễu lọc và các chi tiết tách lớp." width="697" height="762">
        </div>
      </figure>
    </div>
    <div class="bean-orbit bean-orbit-arabica" aria-hidden="true">
      <img src="asset/frame1/variant2/coffee%20ro-02%201.png" alt="" width="310" height="287">

      <img src="asset/frame1/variant1/coffee%20ro-02%201.png" alt="" width="310" height="287">

      <img src="asset/frame1/variant1/coffee%20ro-07%202.png" alt="" width="232" height="216">
      <img src="asset/frame1/variant1/coffee%20ro-08%201.png" alt="" width="120" height="140">
    </div>
    <div class="bean-orbit bean-orbit-filter" aria-hidden="true">
      <img src="asset/frame1/variant3/Hat%20ara-06%201.png" alt="" width="200" height="200">
      <img src="asset/frame1/variant3/Hat%20ara-07%201.png" alt="" width="187" height="178">
      <img src="asset/frame1/variant3/coffee%20ro-05%201.png" alt="" width="130" height="121">

    <button class="arrow prev" type="button" aria-label="Xem sản phẩm trước">
      <img src="asset/frame2/L%20button.png" alt="" width="60" height="60">
    </button>
    <button class="arrow next" type="button" aria-label="Xem sản phẩm tiếp theo">
      <img src="asset/frame2/R%20button.png" alt="" width="60" height="60">
    </button>
    <h1 class="sr-only" id="heroTitle">USAGI Arabica</h1>
  </section>

  <section class="art-section story" id="about" tabindex="-1" aria-labelledby="about-title">
    <h2 class="sr-only" id="about-title">Câu chuyện USAGI</h2>
    <img src="asset/frame2/Story.png" alt="Câu chuyện USAGI: cà phê từ Lâm Đồng, rang từng mẻ nhỏ, không thêm gì vào; một tách cà phê dành cho những phút giây chậm lại." width="1920" height="1006" loading="lazy">
  </section>

  <section class="art-section journal" id="journal" tabindex="-1" aria-labelledby="journal-title">
    <h2 class="sr-only" id="journal-title">Small details make a better cup</h2>

  </section>

    <div class="contact-stage">
