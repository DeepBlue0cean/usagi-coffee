<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USAGI Coffee — Good coffee fits into your day</title>
<meta name="description" content="USAGI Coffee: cà phê Robusta và Arabica Lâm Đồng. Những điều nhỏ bé làm nên một tách cà phê ngon hơn.">
<meta property="og:title" content="USAGI Coffee">
<meta property="og:description" content="Small details make a better cup.">
<meta property="og:image" content="asset/Robusta.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav" id="nav">
  <a href="#product" class="brand" aria-label="USAGI Coffee — đầu trang">
    <img src="asset/logo%20usagi.png" alt="USAGI Coffee & Tea" width="358" height="490">
  </a>
  <nav aria-label="Điều hướng chính">
    <a href="#product">Product</a>
    <a href="#about">About</a>
    <a href="#journal">Journal</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main>
  <section class="hero" id="product" tabindex="-1" aria-label="Sản phẩm USAGI">
    <div class="slides" id="slides" aria-live="polite">
      <figure class="slide active" data-title="USAGI Robusta">
        <img src="asset/Robusta.png" alt="Gói cà phê Robusta USAGI cùng những hạt cà phê rang." width="1920" height="1080">
      </figure>
      <figure class="slide" data-title="USAGI Arabica">
        <img src="asset/Arabica.png" alt="Gói cà phê Arabica USAGI cùng những hạt cà phê rang." width="1920" height="1080">
      </figure>
    </div>
    <button class="arrow prev" type="button" aria-label="Xem sản phẩm trước">
    </button>
    <button class="arrow next" type="button" aria-label="Xem sản phẩm tiếp theo">
    </button>
    <h1 class="sr-only" id="heroTitle">USAGI Robusta</h1>
  </section>

  <section class="art-section story" id="about" tabindex="-1" aria-labelledby="about-title">
    <h2 class="sr-only" id="about-title">Câu chuyện USAGI</h2>
    <img src="asset/Story.png" alt="Câu chuyện USAGI: cà phê từ Lâm Đồng, rang từng mẻ nhỏ, không thêm gì vào; một tách cà phê dành cho những phút giây chậm lại." width="1920" height="1006" loading="lazy">
  </section>

  <section class="art-section journal" id="journal" tabindex="-1" aria-labelledby="journal-title">
    <h2 class="sr-only" id="journal-title">Small details make a better cup</h2>
    <img src="asset/journal.png" alt="Năm bước pha cà phê đá USAGI: cho đá, rót cà phê, thêm sữa đặc, thêm nước hoặc sữa và tìm tỉ lệ phù hợp." width="1920" height="4583" loading="lazy">
  </section>

  <section class="art-section contact" id="contact" tabindex="-1" aria-labelledby="contact-title">
    <h2 class="sr-only" id="contact-title">Good coffee fits into your day</h2>
    <img src="asset/contact.png" alt="Liên hệ USAGI Coffee: 0938.512.599 hoặc facebook.com/Usagicoffeetea." width="1912" height="639" loading="lazy">
    <a class="contact-link phone" href="tel:+84938512599" aria-label="Gọi USAGI Coffee qua số 0938 512 599"></a>
    <a class="contact-link facebook" href="https://facebook.com/Usagicoffeetea" aria-label="USAGI Coffee trên Facebook"></a>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
